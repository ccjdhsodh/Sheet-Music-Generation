[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sheet-music-generation"
version = "0.2.0"
description = "Experimental multi-view piano note refinement"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2", "scipy>=1.10", "torch>=2.1", "librosa==0.10.2.post1", "soundfile", "pretty_midi", "tinysoundfont"]

[project.optional-dependencies]
backbone = ["demucs==4.1.0", "piano_transcription_inference==0.0.6"]

[tool.setuptools.packages.find]
where = ["src"]
